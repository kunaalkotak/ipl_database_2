services:
  # ── FastAPI backend ──────────────────────────────────────────────
  - type: web
    name: ipl-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # you paste this manually on Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure random value
 
  # ── Streamlit frontend ───────────────────────────────────────────
  - type: web
    name: ipl-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: API_URL
        sync: false          # paste your ipl-api Render URL here